# These tests were originally authored against the arm64 backend, but as
# of milestone 6 they have been audited for arm64-only assumptions and
# run on every JIT architecture. Almost all of them are behavioral or
# compile-status tests, meaningful on any backend, and that audit found
# none needing an architecture gate. A test that does depend on one
# backend -- on its register-file shape, or, like the two
# `*-inline-emitted-arm64.js` files, on the assembly it emits -- carries
# its own `REQUIRES: jit-arch-...` line with a comment saying why, rather
# than being gated from here. x86-64's own bring-up tests, which exercise
# shapes these do not, live in the x86-64/ subdirectory.
#
# The directory is skipped only when no backend is enabled at all -- i.e.
# no `jit-arch-*` feature exists. test/lit.cfg warns when that happens
# with the JIT forced on, so an unrecognized architecture does not
# silently swallow the suite.
if not any(f.startswith("jit-arch-") for f in config.available_features):
    config.unsupported = True
